<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Ruang Menunggu Jabatan Kecemasan</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --red-zone: #e74c3c;
            --yellow-zone: #f1c40f;
            --green-zone: #2ecc71;
            --asthma-bay: #3498db;
            --obs-bay: #9b59b6;
        }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        
        /* HEADER (Top Bar) */
        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .datetime-container {
            display: flex;
            gap: 15px;
            align-items: center;
            background: #1a252f;
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 20px;
        }
        .time { color: #f1c40f; font-size: 26px; font-weight: bold; }
        
        /* MAIN LAYOUT (Tengah) */
        .main-container {
            display: flex;
            flex: 1;
            padding: 20px;
            gap: 20px;
        }
        .left-panel { flex: 6; display: flex; flex-direction: column; }
        .right-panel { flex: 4; display: flex; flex-direction: column; }
        .card {
            background: var(--card-bg); 
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            padding: 20px;
            height: 100%;
        }
        
        /* YOUTUBE PLAYER */
        .video-container { padding: 0; overflow: hidden; }
        .video-container iframe { 
            width: 100%; 
            height: 100%; 
            min-height: 400px; 
            border-radius: 12px; 
            border: none; 
        }
        
        /* WAKTU SOLAT */
        .solat-container h2 { margin-top: 0; color: #2c3e50; text-align: center; }
        .solat-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px; 
            margin-top: 20px; 
        }
        .solat-item {
            background: #ecf0f1; 
            padding: 15px; 
            border-radius: 8px;
            text-align: center; 
            font-size: 22px; 
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .solat-item.active { 
            background: #27ae60; 
            color: white; 
            animation: pulse 2s infinite; 
        }
        
        /* DATA PESAKIT (Bawah) */
        .zones-container { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            gap: 20px; 
            padding: 0 20px 20px 20px; 
        }
        .zone-card { 
            color: white; 
            padding: 20px; 
            border-radius: 12px; 
            text-align: center; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }
        .zone-card h3 { margin: 0; font-size: 20px; text-transform: uppercase; }
        .zone-card .count { font-size: 55px; font-weight: bold; margin-top: 10px; }
        
        .zone-red { background-color: var(--red-zone); }
        .zone-yellow { background-color: var(--yellow-zone); color: #333; }
        .zone-green { background-color: var(--green-zone); }
        .zone-asthma { background-color: var(--asthma-bay); }
        .zone-obs { background-color: var(--obs-bay); }
        
        /* FOOTER QURAN */
        footer { 
            background-color: #34495e; 
            color: white; 
            padding: 25px; 
            text-align: center; 
        }
        .quran-arabic { font-size: 36px; font-family: 'Amiri', serif; margin-bottom: 10px; }
        .quran-malay { font-size: 24px; }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(39, 174, 96, 0.7); }
            50% { transform: scale(1.05); box-shadow: 0 0 15px 10px rgba(39, 174, 96, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(39, 174, 96, 0); }
        }
    </style>
</head>
<body>

    <!-- Header: Tajuk & Tarikh/Masa Real-time -->
    <header>
        <div>🏥 Jabatan Kecemasan & Trauma</div>
        <div class="datetime-container">
            <span id="current-day">Isnin</span>, 
            <span id="current-date">01 Januari 2024</span>
            <span class="time" id="current-time">00:00:00 AM</span>
        </div>
    </header>

    <!-- Main Content: Video & Waktu Solat -->
    <div class="main-container">
      <!-- Panel Kiri: Video -->
        <div class="left-panel">
            <div class="card video-container">
                <!-- Video YouTube telah ditukar ke playlist baharu -->
                <iframe 
                    src="https://www.youtube.com/embed/AaBF4oKLQZs?list=PLMDNGtzvgdI0&autoplay=1&mute=1&loop=1" 
                    allow="autoplay; encrypted-media" 
                    allowfullscreen>
                </iframe>
            </div>
        </div>

        <!-- Panel Kanan: Solat -->
        <div class="right-panel">
            <div class="card solat-container">
                <h2>Waktu Solat Harian</h2>
                <div class="solat-grid" id="solat-times">
                    <!-- Data solat akan diisi oleh Javascript -->
                </div>
            </div>
        </div>
    </div>

    <!-- Data Pesakit (Google Sheets) -->
    <div class="zones-container">
        <div class="zone-card zone-red">
            <h3>Zon Merah</h3>
            <div class="count" id="count-red">-</div>
        </div>
        <div class="zone-card zone-yellow">
            <h3>Zon Kuning</h3>
            <div class="count" id="count-yellow">-</div>
        </div>
        <div class="zone-card zone-green">
            <h3>Zon Hijau</h3>
            <div class="count" id="count-green">-</div>
        </div>
        <div class="zone-card zone-asthma">
            <h3>Asthma Bay</h3>
            <div class="count" id="count-asthma">-</div>
        </div>
        <div class="zone-card zone-obs">
            <h3>Observation Bay</h3>
            <div class="count" id="count-obs">-</div>
        </div>
    </div>

    <!-- Footer: Ayat Al-Quran (Berputar setiap 5 minit) -->
    <footer>
        <div class="quran-arabic" id="quran-arabic">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
        <div class="quran-malay" id="quran-malay">Dengan nama Allah, Yang Maha Pemurah, lagi Maha Mengasihani.</div>
    </footer>

    <!-- Audio Player (Tersorok) -->
    <audio id="azan-subuh" src="azan_subuh.mp3"></audio>
    <audio id="azan-biasa" src="azan_biasa.mp3"></audio>

    <!-- SKRIP JAVASCRIPT -->
    <script>
        // ==========================================
        // 1. MASA, HARI & TARIKH SECARA REALTIME
        // ==========================================
        function updateClock() {
            const now = new Date();
            
            const hariMelayu = ['Ahad', 'Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat', 'Sabtu'];
            const bulanMelayu = ['Januari', 'Februari', 'Mac', 'April', 'Mei', 'Jun', 'Julai', 'Ogos', 'September', 'Oktober', 'November', 'Disember'];
            
            const namaHari = hariMelayu[now.getDay()];
            const tarikh = `${now.getDate()} ${bulanMelayu[now.getMonth()]} ${now.getFullYear()}`;
            const masa = now.toLocaleTimeString('en-US', { hour12: true });

            document.getElementById('current-day').innerText = namaHari;
            document.getElementById('current-date').innerText = tarikh;
            document.getElementById('current-time').innerText = masa;
        }
        setInterval(updateClock, 1000);
        updateClock();


        // ==========================================
        // 2. AMBIL DATA PESAKIT (GOOGLE SHEETS)
        // ==========================================
        // PENTING: Gantikan URL di bawah dengan Web App URL anda (tanpa tanda kutip berganda berulang)
        const googleSheetUrl = "https://script.google.com/macros/s/AKfycbwp7EyAK5nTF2VUDIUNyaVc4QpcoWoi0bI3BKU0pvgTSA_6NoGjEKd-JGKv8KW7B3XU/exec"; 

        async function fetchPatientData() {
            if(googleSheetUrl === "LETAK_URL_GOOGLE_SCRIPT_ANDA_DI_SINI") {
                console.warn("Sila letakkan URL Google Script anda.");
                return;
            }
            try {
                const response = await fetch(googleSheetUrl);
                const data = await response.json();
                
                document.getElementById('count-red').innerText = data.merah;
                document.getElementById('count-yellow').innerText = data.kuning;
                document.getElementById('count-green').innerText = data.hijau;
                document.getElementById('count-asthma').innerText = data.asthma;
                document.getElementById('count-obs').innerText = data.obs;
            } catch (error) {
                console.error("Gagal membaca Google Sheets:", error);
            }
        }
        setInterval(fetchPatientData, 10000); // Kemaskini skrin setiap 10 saat
        fetchPatientData();


        // ==========================================
        // 3. WAKTU SOLAT & LAUNGAN AZAN
        // ==========================================
        // Anda boleh menukar waktu ini mengikut zon waktu kawasan anda
        const solatData = { 
            "Subuh": "05:55", 
            "Zohor": "13:15", 
            "Asar": "16:25", 
            "Maghrib": "19:15", 
            "Isyak": "20:25" 
        };
        let azanPlayedToday = {};

        function renderSolat() {
            const container = document.getElementById('solat-times');
            container.innerHTML = ""; // Bersihkan sebelum masukkan data
            for (let [name, time] of Object.entries(solatData)) {
                container.innerHTML += `<div class="solat-item" id="solat-${name}">${name}<br>${time}</div>`;
                azanPlayedToday[name] = false;
            }
        }

        function checkAzan() {
            const now = new Date();
            // Format masa semasa kepada HH:MM (contoh 05:55)
            const currentHourMin = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');

            for (let [name, time] of Object.entries(solatData)) {
                if (currentHourMin === time && !azanPlayedToday[name]) {
                    
                    // Jadikan petak waktu solat berkelip (warna hijau)
                    document.getElementById(`solat-${name}`).classList.add('active');
                    
                    // Mainkan fail Azan yang tepat
                    if (name === "Subuh") {
                        document.getElementById('azan-subuh').play();
                    } else {
                        document.getElementById('azan-biasa').play();
                    }
                    
                    // Tanda sebagai sudah dimainkan hari ini supaya tidak loop (berulang)
                    azanPlayedToday[name] = true;
                    
                    // Hilangkan efek kelip selepas 3 minit (180000 ms)
                    setTimeout(() => {
                        document.getElementById(`solat-${name}`).classList.remove('active');
                    }, 180000);
                }
            }
            
            // Reset "azanPlayedToday" pada jam 12:00 tengah malam
            if (currentHourMin === "00:00") {
                for(let key in azanPlayedToday) { azanPlayedToday[key] = false; }
            }
        }
        
        renderSolat();
        setInterval(checkAzan, 20000); // Periksa masa masuk waktu setiap 20 saat


        // ==========================================
        // 4. PAPARAN AYAT AL-QURAN (Tukar 5 Minit)
        // ==========================================
        const quranVerses = [
            { ar: "فَإِنَّ مَعَ الْعُسْرِ يُسْرًا", ms: "Maka sesungguhnya bersama kesukaran itu ada kemudahan. (Al-Insyirah: 5)" },
            { ar: "وَإِذَا مَرِضْتُ فَهُوَ يَشْفِينِ", ms: "Dan apabila aku sakit, maka Dialah yang menyembuhkan penyakitku. (Asy-Syu'ara: 80)" },
            { ar: "لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا", ms: "Allah tidak membebani seseorang melainkan sesuai dengan kesanggupannya. (Al-Baqarah: 286)" },
            { ar: "وَاسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ", ms: "Dan mintalah pertolongan (kepada Allah) dengan jalan sabar dan mengerjakan sembahyang. (Al-Baqarah: 45)" }
        ];
        let currentVerse = 0;

        function updateQuran() {
            currentVerse = (currentVerse + 1) % quranVerses.length;
            document.getElementById('quran-arabic').innerText = quranVerses[currentVerse].ar;
            document.getElementById('quran-malay').innerText = quranVerses[currentVerse].ms;
        }
        setInterval(updateQuran, 300000); // 300,000 milisaat = 5 minit

    </script>
</body>
</html>
