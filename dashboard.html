<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Ruang Menunggu</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --red-zone: #e74c3c;
            --yellow-zone: #f1c40f;
            --green-zone: #2ecc71;
            --asthma-bay: #3498db;
            --obs-bay: #9b59b6;
        }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        /* Header */
        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 22px;
            font-weight: bold;
        }
        .datetime-container {
            display: flex;
            gap: 15px;
            align-items: center;
            background: #1a252f;
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 20px;
        }
        .time { color: #f1c40f; font-size: 24px; }
        
        /* Main Layout */
        .main-container {
            display: flex;
            flex: 1;
            padding: 20px;
            gap: 20px;
        }
        .left-panel { flex: 6; display: flex; flex-direction: column; gap: 20px; }
        .right-panel { flex: 4; display: flex; flex-direction: column; gap: 20px; }
        .card {
            background: var(--card-bg); border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 20px;
        }
        .video-container iframe { width: 100%; height: 100%; min-height: 400px; border-radius: 8px; border: none; }
        
        /* Waktu Solat */
        .solat-container h2 { margin-top: 0; color: #2c3e50; text-align: center; }
        .solat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 15px; }
        .solat-item {
            background: #ecf0f1; padding: 15px; border-radius: 8px;
            text-align: center; font-size: 20px; font-weight: bold;
        }
        .solat-item.active { background: #27ae60; color: white; animation: pulse 2s infinite; }
        
        /* Patient Counters */
        .zones-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; padding: 0 20px; }
        .zone-card { color: white; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .zone-card h3 { margin: 0; font-size: 18px; }
        .zone-card .count { font-size: 48px; font-weight: bold; margin-top: 10px; }
        .zone-red { background-color: var(--red-zone); }
        .zone-yellow { background-color: var(--yellow-zone); color: #333; }
        .zone-green { background-color: var(--green-zone); }
        .zone-asthma { background-color: var(--asthma-bay); }
        .zone-obs { background-color: var(--obs-bay); }
        
        /* Quran Footer */
        footer { background-color: #34495e; color: white; padding: 25px; text-align: center; }
        .quran-arabic { font-size: 32px; font-family: 'Amiri', serif; margin-bottom: 10px; }
        .quran-malay { font-size: 22px; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <header>
        <div>🏥 Jabatan Kecemasan & Trauma</div>
        <div class="datetime-container">
            <span id="current-day">Isnin</span>, 
            <span id="current-date">01 Januari 2024</span>
            <span class="time" id="current-time">00:00:00 AM</span>
        </div>
    </header>

<div class="card video-container" style="flex: 1; padding: 0; overflow: hidden;">
    <!-- Tambahkan parameter playlist=ID_VIDEO untuk fungsi loop -->
    <iframe 
        src="https://www.youtube.com/watch?v=AaBF4oKLQZs&list=PLMDNGtzvgdI0" 
        allow="autoplay; encrypted-media" 
        allowfullscreen>
    </iframe>
</div>

        <div class="right-panel">
            <div class="card solat-container" style="flex: 1;">
                <h2>Waktu Solat Harian</h2>
                <div class="solat-grid" id="solat-times"></div>
            </div>
        </div>
    </div>

    <div class="zones-container">
        <div class="zone-card zone-red">
            <h3>Zon Merah</h3>
            <div class="count" id="count-red">-</div>
        </div>
        <div class="zone-card zone-yellow">
            <h3>Zon Kuning</h3>
            <div class="count" id="count-yellow">-</div>
        </div>
        <div class="zone-card zone-green">
            <h3>Zon Hijau</h3>
            <div class="count" id="count-green">-</div>
        </div>
        <div class="zone-card zone-asthma">
            <h3>Asthma Bay</h3>
            <div class="count" id="count-asthma">-</div>
        </div>
        <div class="zone-card zone-obs">
            <h3>Observation Bay</h3>
            <div class="count" id="count-obs">-</div>
        </div>
    </div>

    <footer>
        <div class="quran-arabic" id="quran-arabic">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
        <div class="quran-malay" id="quran-malay">Dengan nama Allah, Yang Maha Pemurah, lagi Maha Mengasihani.</div>
    </footer>

    <!-- Audio Azan -->
<audio id="azan-subuh" src="azan_subuh.mp3"></audio>
<audio id="azan-biasa" src="azan_biasa.mp3"></audio>

    <script>
        // 1. MASA, HARI & TARIKH REALTIME
        function updateClock() {
            const now = new Date();
            
            // Susunan nama hari & bulan dalam Bahasa Melayu
            const hariMelayu = ['Ahad', 'Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat', 'Sabtu'];
            const bulanMelayu = ['Januari', 'Februari', 'Mac', 'April', 'Mei', 'Jun', 'Julai', 'Ogos', 'September', 'Oktober', 'November', 'Disember'];
            
            const namaHari = hariMelayu[now.getDay()];
            const tarikh = `${now.getDate()} ${bulanMelayu[now.getMonth()]} ${now.getFullYear()}`;
            const masa = now.toLocaleTimeString('en-US', { hour12: true }); // Format 12-jam (AM/PM)

            document.getElementById('current-day').innerText = namaHari;
            document.getElementById('current-date').innerText = tarikh;
            document.getElementById('current-time').innerText = masa;
        }
        setInterval(updateClock, 1000);
        updateClock(); // Panggil terus masa dimuatkan

        // 2. DATA PESAKIT DARI GOOGLE SHEETS
        // PENTING: Gantikan URL di bawah dengan Web App URL anda dari Langkah 1
        const googleSheetUrl = "https://script.google.com/macros/s/AKfycbwp7EyAK5nTF2VUDIUNyaVc4QpcoWoi0bI3BKU0pvgTSA_6NoGjEKd-JGKv8KW7B3XU/exec"; 

        async function fetchPatientData() {
            if(googleSheetUrl === "LETAK_URL_WEBAPP_GOOGLE_SCRIPT_DI_SINI") return; // Abaikan jika URL belum diisi
            try {
                const response = await fetch(googleSheetUrl);
                const data = await response.json();
                
                // Kemaskini paparan nombor
                document.getElementById('count-red').innerText = data.merah;
                document.getElementById('count-yellow').innerText = data.kuning;
                document.getElementById('count-green').innerText = data.hijau;
                document.getElementById('count-asthma').innerText = data.asthma;
                document.getElementById('count-obs').innerText = data.obs;
            } catch (error) {
                console.error("Gagal mendapatkan data pesakit:", error);
            }
        }
        // Semak update dari Google Sheet setiap 10 saat
        setInterval(fetchPatientData, 10000); 
        fetchPatientData(); // Ambil data terus semasa mula-mula dibuka

        // 3. WAKTU SOLAT & AZAN (Mock Data)
        const solatData = { "Subuh": "05:55", "Zohor": "13:15", "Asar": "16:25", "Maghrib": "19:15", "Isyak": "20:25" };
        let azanPlayedToday = {};

        function renderSolat() {
            const container = document.getElementById('solat-times');
            for (let [name, time] of Object.entries(solatData)) {
                container.innerHTML += `<div class="solat-item" id="solat-${name}">${name}<br>${time}</div>`;
                azanPlayedToday[name] = false;
            }
        }

        function checkAzan() {
    const now = new Date();
    const currentHourMin = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');

    for (let [name, time] of Object.entries(solatData)) {
        if (currentHourMin === time && !azanPlayedToday[name]) {
            document.getElementById(`solat-${name}`).classList.add('active');
            
            // Pilihan MP3 berdasarkan waktu solat
            if (name === "Subuh") {
                document.getElementById('azan-subuh').play();
            } else {
                document.getElementById('azan-biasa').play();
            }
            
            azanPlayedToday[name] = true;
            
            // Hilangkan efek aktif selepas 3 minit
            setTimeout(() => {
                document.getElementById(`solat-${name}`).classList.remove('active');
            }, 180000);
        }
    
        renderSolat();
        setInterval(checkAzan, 30000);

        // 4. AYAT AL-QURAN (Bertukar 5 Minit / 300000ms)
        const quranVerses = [
            { ar: "فَإِنَّ مَعَ الْعُسْرِ يُسْرًا", ms: "Maka sesungguhnya bersama kesukaran itu ada kemudahan. (Al-Insyirah: 5)" },
            { ar: "وَإِذَا مَرِضْتُ فَهُوَ يَشْفِينِ", ms: "Dan apabila aku sakit, maka Dialah yang menyembuhkan penyakitku. (Asy-Syu'ara: 80)" },
            { ar: "لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا", ms: "Allah tidak membebani seseorang melainkan sesuai dengan kesanggupannya. (Al-Baqarah: 286)" }
        ];
        let currentVerse = 0;

        function updateQuran() {
            currentVerse = (currentVerse + 1) % quranVerses.length;
            document.getElementById('quran-arabic').innerText = quranVerses[currentVerse].ar;
            document.getElementById('quran-malay').innerText = quranVerses[currentVerse].ms;
        }
        setInterval(updateQuran, 300000);

    </script>
</body>
</html>
